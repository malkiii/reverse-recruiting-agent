services:
  dashboard:
    build: .
    command: npm run dev
    env_file: .env.local
    environment:
      FUNCTIONS_BASE_URL: http://worker:8000
    ports:
      - "3000:3000"
    depends_on:
      - worker

  worker:
    build: .
    command: npm run worker
    env_file: .env.local
    environment:
      # Forces Sending off in Compose, so testing can't email real Decision Makers whatever Settings says.
      # Start with DISABLE_SEND=false to send.
      DISABLE_SEND: ${DISABLE_SEND:-true}
